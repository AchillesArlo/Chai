# Logstash pipeline configuration for production log aggregation

input {
  # Receive logs from Docker via Beats protocol
  beats {
    port => 5044
  }

  # Receive logs via TCP (for application-level logging)
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # Parse JSON log messages from Node.js services
  if [message] =~ /^\{/ {
    json {
      source => "message"
    }
  }

  # Add timestamp if missing
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }

  # Tag service names from container labels
  if [container][name] {
    mutate {
      add_field => { "service" => "%{[container][name]}" }
    }
  }

  # Parse error stack traces
  if [stack_trace] {
    mutate {
      add_tag => [ "has_stack_trace" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "chai-logs-%{+YYYY.MM.dd}"
    template_name => "chai-logs"
  }
}
