# Chai Production Environment
# High-availability deployment with monitoring and logging
# Usage: docker compose -f infra/production/docker-compose.yml up -d
#
# DEPLOYMENT MODEL — single-node Docker Compose (NOT Swarm), chosen deliberately.
# This file is driven by `docker compose up -d`, never `docker stack deploy`.
# Rationale: it relies on `build:` contexts, `depends_on` conditions
# (service_healthy / service_completed_successfully) and top-level `restart:` —
# all of which Swarm ignores. Verified on Docker Compose v2 (Docker 28.x):
# `docker compose up` DOES honour `deploy.replicas` and `deploy.resources.limits`
# (proven — replicas:3 started 3 containers, a 128M limit was applied), so the
# `deploy:` blocks below are effective under `up`, not dead Swarm-only config.
#
# ONE IMAGE, MANY ENTRYPOINTS — every app service builds and runs the same
# `chai:${IMAGE_TAG:-latest}` image (see infra/Dockerfile) and differs only by
# `command:`. Compose builds it once and reuses it; scripts/production/deploy.sh
# tags and pushes that single image.

services:
  # ============================================================================
  # Infrastructure Services
  # ============================================================================
  
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chai}
      POSTGRES_USER: ${POSTGRES_USER:-chai_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-200}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chai_admin} -d ${POSTGRES_DB:-chai}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    restart: always
    networks:
      - backend

  redis-master:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 2gb --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_master_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 2G
    restart: always
    networks:
      - backend

  # 3 sentinels for a real failover quorum (quorum=2). They are NOT published to
  # the host: under single-node `docker compose up`, replicas:3 with a fixed host
  # port (26379:26379) would make all three replicas try to bind the same host
  # port and only one could start. Sentinel is an INTERNAL service — the API and
  # workers reach it over the `backend` network by service name on 26379, no host
  # publish required — so the fix is to drop the host port, not to cut replicas.
  # (Client-side discovery still targets the sentinel set over the backend
  # network; container-port 26379 is open to the network without a host mapping.)
  redis-sentinel:
    image: redis:7.4-alpine
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: always
    networks:
      - backend

  # ============================================================================
  # Automated Database Backups
  # ============================================================================
  #
  # Scheduled logical backups (pg_dump) to a retained volume — a REAL unattended
  # backup, not the one-off pg_dump in the deploy script / runbook. Prunes to the
  # newest BACKUP_RETENTION_COUNT dumps.
  #
  # RPO REALITY (do not over-claim): a logical dump is a point-in-time snapshot
  # taken every BACKUP_INTERVAL_SECONDS, so worst-case data loss (RPO) equals that
  # interval — ~1h with the shipped hourly default. This does NOT meet a
  # sub-5-minute RPO; that needs continuous WAL archiving / streaming replication
  # (PITR). The go-live runbook states this honestly and names PITR as the upgrade
  # path. Tighten the interval for a smaller RPO at higher I/O cost, or add WAL
  # archiving for minutes-level RPO.
  #
  # Connects as POSTGRES_USER (the schema owner/superuser) ON PURPOSE: every
  # tenant table is FORCE RLS, so a NOBYPASSRLS runtime role (chai_api/chai_worker)
  # would dump a SILENTLY INCOMPLETE database — RLS would filter out rows it may
  # not see. Only the owner/superuser captures every tenant's rows, which is
  # exactly what a backup must do. Backups are an admin task, so reusing the
  # migrate-tier role keeps the runtime roles NOBYPASSRLS (tenant-isolation
  # invariant intact).
  postgres-backup:
    image: postgres:17.6-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-chai_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-chai}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-48}
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        echo "[backup] loop start: interval=$${BACKUP_INTERVAL_SECONDS}s retention=$${BACKUP_RETENTION_COUNT} dumps"
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          raw="/backups/chai-$${PGDATABASE}-$${ts}.sql.partial"
          out="/backups/chai-$${PGDATABASE}-$${ts}.sql.gz"
          if pg_dump > "$${raw}"; then
            gzip -c "$${raw}" > "$${out}"
            rm -f "$${raw}"
            echo "[backup] wrote $${out}"
          else
            echo "[backup] pg_dump FAILED (ts=$${ts})" >&2
            rm -f "$${raw}"
          fi
          count=$$(ls -1 /backups/chai-*.sql.gz 2>/dev/null | wc -l)
          if [ "$${count}" -gt "$${BACKUP_RETENTION_COUNT}" ]; then
            ls -1t /backups/chai-*.sql.gz | tail -n +$$((BACKUP_RETENTION_COUNT + 1)) | while IFS= read -r f; do rm -f "$${f}"; done
          fi
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: always
    networks:
      - backend

  # ============================================================================
  # Database Migrations (one-shot; must complete before API and workers start)
  # ============================================================================

  # Runs the raw-SQL migrations as the single migration authority. Dependency:
  # the `migrate` script in @chai/database (added under the database task) —
  # `pnpm --filter @chai/database run migrate`. Because this now owns schema
  # setup, the postgres /docker-entrypoint-initdb.d migrations mount was removed
  # so migrations are not also applied out-of-band on first boot.
  #
  # This is the ONLY service that connects as POSTGRES_USER (the owner/superuser)
  # — migrations create/alter schema, roles, and RLS policies, which is exactly
  # the owner's job. Every RUNTIME service below connects as a NOBYPASSRLS LOGIN
  # role (chai_api / chai_worker, created by migration 0051) so RLS is enforced
  # on the app/worker path. A superuser on the runtime path silently bypasses RLS
  # (FORCE RLS does not apply to it) and breaks tenant isolation — the C2 blocker.
  migrate:
    image: chai:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/database", "run", "migrate"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  # ============================================================================
  # API Services
  # ============================================================================

  api:
    image: chai:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/api", "start"]
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://chai_api:${CHAI_API_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379
      REDIS_SENTINELS: redis-sentinel-0:26379,redis-sentinel-1:26379,redis-sentinel-2:26379
      REDIS_SENTINEL_NAME: chai-master
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MFA_SECRET_KEY: ${MFA_SECRET_KEY:?MFA_SECRET_KEY is required}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      ENABLE_METRICS: "true"
      METRICS_PORT: 9090
      ENABLE_TRACING: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    restart: always
    networks:
      - backend
      - frontend
      - monitoring

  realtime-gateway:
    image: chai:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/realtime-gateway", "start"]
    environment:
      NODE_ENV: production
      REALTIME_PORT: 3010
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_METRICS: "true"
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: always
    networks:
      - backend
      - frontend
      - monitoring

  # ============================================================================
  # Worker Services
  # ============================================================================
  #
  # Worker healthchecks use `pgrep -f <name>`, which matches the container's
  # PID 1 — the `pnpm --filter @chai/worker-<name> start` supervisor, whose argv
  # carries the unique worker name (verified in-image). This is a LIVENESS probe
  # only: it proves the supervisor is running, and since the supervisor forks
  # `node … src/main.ts` and exits when that runtime dies (stopping the
  # container), it does track the worker being alive. It CANNOT detect a
  # hung-but-alive worker. A true readiness probe would require the worker to
  # expose a health signal (HTTP endpoint or heartbeat); that is worker source
  # code and out of scope for this infra file, and the workers expose no HTTP
  # port, so pgrep is the strongest signal available without changing them.

  channel-worker:
    image: chai:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/worker-channel-worker", "start"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://chai_worker:${CHAI_WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${CHANNEL_WORKER_CONCURRENCY:-10}
      ENABLE_METRICS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "channel-worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    restart: always
    networks:
      - backend
      - monitoring

  automation-worker:
    image: chai:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/worker-automation-worker", "start"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://chai_worker:${CHAI_WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${AUTOMATION_WORKER_CONCURRENCY:-5}
      ENABLE_METRICS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "automation-worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    restart: always
    networks:
      - backend
      - monitoring

  # --------------------------------------------------------------------------
  # NOTE: every worker package now ships as a deployed service (below). The former
  # media-worker was a dead package — a pure classifier (classifyMediaJob) with no
  # main.ts, no job source, and no importers — and was removed. The media
  # capability is deferred until object storage exists; see
  # docs/plans/2026-07-27-deferred-workers-roadmap.md.
  # --------------------------------------------------------------------------

  analytics-worker:
    image: chai:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/worker-analytics-worker", "start"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://chai_worker:${CHAI_WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${ANALYTICS_WORKER_CONCURRENCY:-3}
      ANALYTICS_BURN_RATE_INTERVAL_MS: ${ANALYTICS_BURN_RATE_INTERVAL_MS:-60000}
      ENABLE_METRICS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "analytics-worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    restart: always
    networks:
      - backend
      - monitoring

  # Payment reconciliation: polls non-terminal sessions and applies provider
  # outcomes through the shared transition machine. Single replica by design —
  # concurrent reconcilers would contend on the same FOR UPDATE rows for no gain.
  payment-worker:
    image: chai:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/worker-payment-worker", "start"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://chai_worker:${CHAI_WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PROVIDER_PAYMENT: ${PROVIDER_PAYMENT:-mock}
      PAYMENT_POLL_INTERVAL_MS: ${PAYMENT_POLL_INTERVAL_MS:-15000}
      PAYMENT_RECONCILE_BATCH: ${PAYMENT_RECONCILE_BATCH:-50}
      ENABLE_METRICS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "payment-worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: always
    networks:
      - backend
      - monitoring

  # Carrier tracking fallback: re-polls shipments whose last sync exceeded the
  # SLA and appends deduplicated tracking events.
  logistics-worker:
    image: chai:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/worker-logistics-worker", "start"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://chai_worker:${CHAI_WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PROVIDER_LOGISTICS: ${PROVIDER_LOGISTICS:-mock}
      LOGISTICS_POLL_INTERVAL_MS: ${LOGISTICS_POLL_INTERVAL_MS:-30000}
      LOGISTICS_SLA_MS: ${LOGISTICS_SLA_MS:-21600000}
      LOGISTICS_RECONCILE_BATCH: ${LOGISTICS_RECONCILE_BATCH:-50}
      ENABLE_METRICS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "logistics-worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: always
    networks:
      - backend
      - monitoring

  inbox-dispatcher:
    image: chai:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/worker-inbox-dispatcher", "start"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://chai_worker:${CHAI_WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_METRICS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "inbox-dispatcher"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: always
    networks:
      - backend
      - monitoring

  outbox-dispatcher:
    image: chai:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/worker-outbox-dispatcher", "start"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://chai_worker:${CHAI_WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_METRICS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "outbox-dispatcher"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: always
    networks:
      - backend
      - monitoring

  # ============================================================================
  # Frontend Services
  # ============================================================================

  owner-console:
    image: chai:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/owner-console", "start"]
    environment:
      NODE_ENV: production
      APP_ENV: production
      NEXT_PUBLIC_API_URL: ${OWNER_CONSOLE_API_URL:-https://api.chai.example.com}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: always
    networks:
      - frontend

  client-portal:
    image: chai:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/client-portal", "start"]
    environment:
      NODE_ENV: production
      APP_ENV: production
      NEXT_PUBLIC_API_URL: ${CLIENT_PORTAL_API_URL:-https://api.chai.example.com}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: always
    networks:
      - frontend

  # ============================================================================
  # Reverse Proxy
  # ============================================================================

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./nginx-logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      realtime-gateway:
        condition: service_healthy
      owner-console:
        condition: service_healthy
      client-portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx_status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Single replica by necessity: nginx is the public edge and MUST publish the
    # fixed host ports 80/443. Under single-node `docker compose up`, replicas:3
    # would make all three containers try to bind the same host ports 80/443 and
    # only one could start (the others crash-loop on "address already in use").
    # Unlike sentinel, nginx CANNOT drop its host ports — it is the ingress — so
    # the correct fix here is one replica, not port removal. Horizontal scaling of
    # the edge belongs in front of Compose (a real LB / multiple nodes / Swarm),
    # not in three same-host containers fighting over one port pair.
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: always
    networks:
      - frontend

  # ============================================================================
  # Monitoring Stack
  # ============================================================================

  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../../infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    restart: always
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3003}
    ports:
      - "${GRAFANA_PORT:-3003}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../infra/monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    restart: always
    networks:
      - monitoring

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ['--config=/etc/otel-collector-config.yaml']
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    volumes:
      - ../../infra/monitoring/otel-collector.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:13133"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: always
    networks:
      - monitoring

  # ============================================================================
  # Log Aggregation (ELK Stack)
  # ============================================================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - xpack.security.enabled=false
      - cluster.name=chai-logs
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    restart: always
    networks:
      - logging

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    ports:
      - "${LOGSTASH_PORT:-5044}:5044"
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    restart: always
    networks:
      - logging

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    restart: always
    networks:
      - logging

volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local
  redis_master_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  monitoring:
    driver: bridge
  logging:
    driver: bridge
