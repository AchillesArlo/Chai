# PostgreSQL production tuning
# Mounted at /etc/postgresql/postgresql.conf
# NOTE: this file uses '#' for comments. '--' is a SQL comment and makes
# PostgreSQL abort with "configuration file contains errors" on startup.

# Connection settings
listen_addresses = '*'
max_connections = 200

# Memory settings (for 8GB allocated container)
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 32MB
maintenance_work_mem = 512MB

# WAL settings
wal_buffers = 64MB
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# Continuous archiving for point-in-time recovery (K-04).
#
# The scheduled pg_dump in the postgres-backup service alone caps RPO at the
# dump interval (1h by default): everything written after the last dump is
# lost. Archiving every completed WAL segment alongside those dumps drops RPO
# to the archive lag (seconds), because recovery replays a base backup forward
# through the WAL to any chosen point in time.
#
# wal_level=replica is the PG17 default and is already sufficient for archive
# recovery; it is stated explicitly so a future edit cannot silently drop to
# 'minimal' and break archiving.
wal_level = replica
archive_mode = on
# %p = path of the segment to archive, %f = its bare filename. The test -f
# guard makes re-archiving an already-copied segment a success rather than an
# error, which is what PostgreSQL requires of an idempotent archive_command.
archive_command = 'test ! -f /wal_archive/%f && cp %p /wal_archive/%f'
# Force a segment switch (and therefore an archive) at least this often, so an
# idle database still bounds RPO instead of holding the tail in a partial
# segment indefinitely.
archive_timeout = 60s

# Query tuning
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0

# SSL (enable when certificates are provisioned)
# ssl = on
# ssl_cert_file = '/etc/ssl/certs/server.crt'
# ssl_key_file = '/etc/ssl/private/server.key'

# Authentication
password_encryption = scram-sha-256
