worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:20m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=auth:20m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:20m rate=30r/s;
    # Throttling is a client-rate problem, not a server fault. nginx defaults
    # limit_req_status to 503, which tells callers the service is broken and
    # pollutes availability SLOs; 429 is the correct signal and matches the
    # API's own RATE_LIMITED envelope.
    limit_req_status 429;

    # Upstream definitions with health checks
    upstream api_backend {
        least_conn;
        server api:3000;
        keepalive 32;
    }

    upstream realtime_backend {
        ip_hash;
        server realtime-gateway:3010;
        keepalive 16;
    }

    upstream owner_console_backend {
        server owner-console:3000;
        keepalive 16;
    }

    upstream client_portal_backend {
        server client-portal:3002;
        keepalive 16;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Nginx status (internal only)
        location /nginx_status {
            stub_status on;
            access_log off;
            # 127.0.0.1: the container's own HEALTHCHECK probes itself via
            # loopback, which is neither 172.16.0.0/12 nor 10.0.0.0/8.
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            deny all;
        }

        # API routes
        location /api/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Auth endpoints
        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://realtime_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Owner Console
        location / {
            proxy_pass http://owner_console_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Client Portal
        # No rewrite: client-portal declares basePath: '/portal' (next.config.ts),
        # so it expects and serves /portal/* natively -- including /portal/_next/*
        # assets. Stripping the prefix here would misroute those assets to the
        # owner-console `location /` block instead.
        location /portal/ {
            proxy_pass http://client_portal_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Path is /api/v1/health (the route actually registered by
        # HealthController), not /health -- confirmed via Nest boot log
        # RouterExplorer output; matches the Dockerfile HEALTHCHECK.
        location /health {
            proxy_pass http://api_backend/api/v1/health;
            proxy_set_header Host $host;
        }
    }

    # HTTP redirect to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}
