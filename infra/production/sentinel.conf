# Redis Sentinel configuration for production HA

# Sentinel port
port 26379

# Monitor the master named "chai-master" at redis-master:6379
# quorum of 2 means 2 sentinels must agree on failover
sentinel monitor chai-master redis-master 6379 2

# Consider master down after 30 seconds of no response
sentinel down-after-milliseconds chai-master 30000

# Failover timeout: 3 minutes
sentinel failover-timeout chai-master 180000

# Only sync 1 replica at a time during failover
sentinel parallel-syncs chai-master 1

# Authentication (must match REDIS_PASSWORD)
# sentinel auth-pass chai-master <REDIS_PASSWORD>

# Logging
loglevel notice
