# Redis Sentinel configuration for production HA
#
# Three fixes verified empirically against redis:7.4-alpine; without them
# sentinel exits at startup and failover HA does not exist:
#
#   1. resolve-hostnames — `sentinel monitor ... redis-master ...` names a
#      Docker service, but Sentinel REJECTS hostnames unless this is on:
#      "Can't resolve instance hostname" -> FATAL CONFIG FILE ERROR, even
#      though the name resolves fine from other containers on the network.
#   2. The config file must be WRITABLE. Sentinel rewrites it to persist
#      discovered replicas/epochs: mounted read-only it exits with
#      "Sentinel config file ... is not writable: Read-only file system".
#      The compose service therefore copies it to a writable path at start.
#   3. auth-pass must be SET, not commented. redis-master runs with
#      --requirepass, so without it Sentinel cannot authenticate and can
#      never monitor the master. It is injected from REDIS_PASSWORD by the
#      compose command rather than hardcoded here, because this file is in
#      git and must not carry a credential.

# Hostnames instead of IPs: container IPs are not stable across restarts.
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Sentinel port
port 26379

# Monitor the master named "chai-master" at redis-master:6379
# quorum of 2 means 2 sentinels must agree on failover
sentinel monitor chai-master redis-master 6379 2

# Consider master down after 30 seconds of no response
sentinel down-after-milliseconds chai-master 30000

# Failover timeout: 3 minutes
sentinel failover-timeout chai-master 180000

# Only sync 1 replica at a time during failover
sentinel parallel-syncs chai-master 1

# Authentication: injected at startup from REDIS_PASSWORD by the compose
# command (see redis-sentinel service). Never hardcode it in this file.

# Logging
loglevel notice
