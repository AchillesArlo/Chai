# OpenTelemetry collector skeleton for Stage 1 pilot.
# Receivers/exporters are local-only; production swaps the exporter endpoint.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}
  attributes:
    actions:
      - key: stage
        value: "1"
        action: upsert

exporters:
  logging:
    loglevel: info
  # ponytail: production exporter (e.g. otlphttp) lands with managed backend.

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, attributes]
      exporters: [logging]
    metrics:
      receivers: [otlp]
      processors: [batch, attributes]
      exporters: [logging]
