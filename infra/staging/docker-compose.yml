# Chai Staging Environment
# Multi-service deployment with health checks and monitoring
# Usage: docker compose -f infra/staging/docker-compose.yml up -d

services:
  # ============================================================================
  # Infrastructure Services
  # ============================================================================
  
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chai}
      POSTGRES_USER: ${POSTGRES_USER:-chai_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chai_admin} -d ${POSTGRES_DB:-chai}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    networks:
      - backend

  # ============================================================================
  # Database Migrations (one-shot; must complete before API and workers start)
  # ============================================================================

  # Runs the raw-SQL migrations as the single migration authority. Dependency:
  # the `migrate` script in @chai/database (added under the database task) —
  # `pnpm --filter @chai/database run migrate`. Because this now owns schema
  # setup, the postgres /docker-entrypoint-initdb.d migrations mount was removed
  # so migrations are not also applied out-of-band on first boot.
  migrate:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/database", "run", "migrate"]
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  # ============================================================================
  # API Services
  # ============================================================================

  api:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/api", "start"]
    environment:
      NODE_ENV: staging
      APP_ENV: staging
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_METRICS: "true"
      METRICS_PORT: 9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    networks:
      - backend
      - frontend

  realtime-gateway:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/realtime-gateway", "start"]
    environment:
      NODE_ENV: staging
      REALTIME_PORT: 3010
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    networks:
      - backend
      - frontend

  # ============================================================================
  # Worker Services
  # ============================================================================

  channel-worker:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/worker-channel-worker", "start"]
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${CHANNEL_WORKER_CONCURRENCY:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "channel-worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    networks:
      - backend

  automation-worker:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/worker-automation-worker", "start"]
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${AUTOMATION_WORKER_CONCURRENCY:-3}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "automation-worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    networks:
      - backend

  # --------------------------------------------------------------------------
  # payment-worker / logistics-worker / media-worker are intentionally NOT
  # deployed yet. Their packages currently expose only pure, unwired helpers
  # (pollAndReconcile, shouldMarkStale, classifyMediaJob) with no durable job
  # source: they do not depend on @chai/database, and the mock connector stores
  # are per-process/in-memory, so a standalone process would have nothing to
  # reconcile, sweep, or classify. A `start` loop here would be a container that
  # only pretends to do work, so no `start` script was invented for them.
  # They return once a real job source lands: a DB-backed session/shipment
  # repository query (payment, logistics) or an object-storage/media queue
  # consumer (media) — mirroring how analytics-worker drives the real
  # runBurnRateHarvest pass below.
  # --------------------------------------------------------------------------

  analytics-worker:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/worker-analytics-worker", "start"]
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${ANALYTICS_WORKER_CONCURRENCY:-2}
      ANALYTICS_BURN_RATE_INTERVAL_MS: ${ANALYTICS_BURN_RATE_INTERVAL_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "analytics-worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    networks:
      - backend

  inbox-dispatcher:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/worker-inbox-dispatcher", "start"]
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "inbox-dispatcher"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    networks:
      - backend

  outbox-dispatcher:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/worker-outbox-dispatcher", "start"]
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "outbox-dispatcher"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    networks:
      - backend

  # media-worker: intentionally not deployed — see the disabled-workers note
  # above the analytics-worker service for the rationale and upgrade path.

  # ============================================================================
  # Temporal Services
  # ============================================================================

  temporal:
    image: temporalio/auto-setup:1.26
    environment:
      DB: postgresql
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-chai_admin}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--address", "localhost:7233"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    networks:
      - backend

  temporal-ui:
    image: temporalio/ui:2.34
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "${TEMPORAL_UI_PORT:-8080}:8080"
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped
    networks:
      - backend
      - frontend

  temporal-worker:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/worker-temporal", "start:worker"]
    environment:
      NODE_ENV: staging
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "tsx src/worker.ts"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    networks:
      - backend

  # ============================================================================
  # Frontend Services
  # ============================================================================

  owner-console:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/owner-console", "start"]
    environment:
      NODE_ENV: staging
      APP_ENV: staging
      NEXT_PUBLIC_API_URL: ${OWNER_CONSOLE_API_URL:-http://api:3000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    networks:
      - frontend

  client-portal:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/client-portal", "start"]
    environment:
      NODE_ENV: staging
      APP_ENV: staging
      NEXT_PUBLIC_API_URL: ${CLIENT_PORTAL_API_URL:-http://api:3000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    networks:
      - frontend

  # ============================================================================
  # Reverse Proxy
  # ============================================================================

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      realtime-gateway:
        condition: service_healthy
      owner-console:
        condition: service_healthy
      client-portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx_status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped
    networks:
      - frontend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
