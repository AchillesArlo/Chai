# Chai Staging Environment
# Multi-service deployment with health checks and monitoring
# Usage: docker compose -f infra/staging/docker-compose.yml up -d

services:
  # ============================================================================
  # Infrastructure Services
  # ============================================================================
  
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chai}
      POSTGRES_USER: ${POSTGRES_USER:-chai_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chai_admin} -d ${POSTGRES_DB:-chai}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    networks:
      - backend

  # ============================================================================
  # Database Migrations (one-shot; must complete before API and workers start)
  # ============================================================================

  # Runs the raw-SQL migrations as the single migration authority. Dependency:
  # the `migrate` script in @chai/database (added under the database task) —
  # `pnpm --filter @chai/database run migrate`. Because this now owns schema
  # setup, the postgres /docker-entrypoint-initdb.d migrations mount was removed
  # so migrations are not also applied out-of-band on first boot.
  #
  # This is the ONLY chai service that connects as POSTGRES_USER (owner/superuser)
  # — its job is DDL: schema, roles, and RLS policies. Every RUNTIME service
  # below connects as a NOBYPASSRLS LOGIN role (chai_api / chai_worker, created by
  # migration 0051) so RLS is enforced on the app/worker path.
  migrate:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    # Migrations (0051) deliberately create chai_api/chai_worker WITHOUT a
    # password -- credentials must never live in a checksum-pinned migration
    # file. provision-runtime-passwords is the out-of-band step the
    # migration's own comment describes, run every startup as chai_admin
    # (idempotent: ALTER ROLE always succeeds, it just resets the password to
    # the current env value). Without this, chai_api/chai_worker can NEVER
    # authenticate on a fresh volume and every request touching the database
    # fails with a swallowed 500 (verified: role has no password set at all).
    command:
      - sh
      - -c
      - "pnpm --filter @chai/database run migrate && pnpm --filter @chai/database run provision-passwords"
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      CHAI_API_DB_PASSWORD: ${CHAI_API_DB_PASSWORD:?CHAI_API_DB_PASSWORD is required}
      CHAI_WORKER_DB_PASSWORD: ${CHAI_WORKER_DB_PASSWORD:?CHAI_WORKER_DB_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  # ============================================================================
  # API Services
  # ============================================================================

  api:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/api", "start"]
    environment:
      NODE_ENV: staging
      APP_ENV: staging
      PORT: 3000
      DATABASE_URL: postgres://chai_api:${CHAI_API_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MFA_SECRET_KEY: ${MFA_SECRET_KEY:?MFA_SECRET_KEY is required}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      ENABLE_METRICS: "true"
      METRICS_PORT: 9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    networks:
      - backend
      - frontend

  realtime-gateway:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/realtime-gateway", "start"]
    environment:
      NODE_ENV: staging
      REALTIME_PORT: 3010
      # Required: main.ts refuses to start with the in-memory event store
      # (not shared across replicas, loses the replay window on restart).
      DATABASE_URL: postgres://chai_api:${CHAI_API_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    networks:
      - backend
      - frontend

  # ============================================================================
  # Worker Services
  # ============================================================================
  #
  # Worker healthchecks use `pgrep -f <name>`, which matches the container's PID 1
  # — the `pnpm --filter @chai/worker-<name> start` supervisor, whose argv carries
  # the unique worker name. This is a LIVENESS probe only: it proves the supervisor
  # process is up, and because the supervisor forks `node … src/main.ts` and exits
  # when that runtime dies (stopping the container), it does track the worker being
  # alive. It CANNOT detect a hung-but-alive worker. A true readiness probe would
  # require the worker to expose a health signal (HTTP endpoint or heartbeat) —
  # that is worker source code and out of scope for this infra file, and the
  # workers expose no HTTP port, so pgrep is the strongest signal available here
  # without changing them.

  channel-worker:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/worker-channel-worker", "start"]
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgres://chai_worker:${CHAI_WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${CHANNEL_WORKER_CONCURRENCY:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "channel-worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    networks:
      - backend

  automation-worker:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/worker-automation-worker", "start"]
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgres://chai_worker:${CHAI_WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${AUTOMATION_WORKER_CONCURRENCY:-3}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "automation-worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    networks:
      - backend

  # --------------------------------------------------------------------------
  # NOTE: the former media-worker was a dead package (a pure classifier,
  # classifyMediaJob, with no main.ts, no job source, and no importers) and was
  # removed; the media capability is deferred until object storage exists
  # (docs/plans/2026-07-27-deferred-workers-roadmap.md).
  #
  # payment-worker and logistics-worker are real, deployable services (DB-backed
  # reconcile loops + `start` scripts) and DO run in infra/production; this
  # staging compose simply does not wire them in. Add them here the same way as
  # the production file when staging needs payment/logistics reconciliation.
  # --------------------------------------------------------------------------

  analytics-worker:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/worker-analytics-worker", "start"]
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgres://chai_worker:${CHAI_WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${ANALYTICS_WORKER_CONCURRENCY:-2}
      ANALYTICS_BURN_RATE_INTERVAL_MS: ${ANALYTICS_BURN_RATE_INTERVAL_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "analytics-worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    networks:
      - backend

  inbox-dispatcher:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/worker-inbox-dispatcher", "start"]
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgres://chai_worker:${CHAI_WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "inbox-dispatcher"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    networks:
      - backend

  outbox-dispatcher:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/worker-outbox-dispatcher", "start"]
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgres://chai_worker:${CHAI_WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-chai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "outbox-dispatcher"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    networks:
      - backend

  # ============================================================================
  # Frontend Services
  # ============================================================================

  owner-console:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/owner-console", "start"]
    environment:
      NODE_ENV: staging
      APP_ENV: staging
      NEXT_PUBLIC_API_URL: ${OWNER_CONSOLE_API_URL:-http://api:3000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    networks:
      - frontend

  client-portal:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["pnpm", "--filter", "@chai/client-portal", "start"]
    environment:
      NODE_ENV: staging
      APP_ENV: staging
      NEXT_PUBLIC_API_URL: ${CLIENT_PORTAL_API_URL:-http://api:3000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # basePath: '/portal' (next.config.ts) means / now 404s; probe a real
      # route under the prefix instead.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3002/portal/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    networks:
      - frontend

  # ============================================================================
  # Reverse Proxy
  # ============================================================================

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      realtime-gateway:
        condition: service_healthy
      owner-console:
        condition: service_healthy
      client-portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx_status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Single replica by necessity: nginx publishes fixed host ports 80/443 and is
    # the public edge, so replicas>1 under single-node `docker compose up` would
    # collide on those host ports (only one could bind them). Scale the edge in
    # front of Compose, not with same-host replicas.
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped
    networks:
      - frontend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
