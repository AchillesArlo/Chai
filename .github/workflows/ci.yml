name: ci

# Gate for the blueprint's non-negotiables (02 §5, GAP-009). The import-boundary
# rules live in eslint.config.mjs, so `lint` is what makes a cross-boundary import
# fail the build rather than merely being discouraged in a document.
on:
  pull_request:
  push:
    # This repo's default branch is `master` (see `git branch`). Listing only
    # `main` meant push events never matched and CI never ran on a merge.
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24.12.0

      - run: pnpm install --frozen-lockfile

      # Supply-chain gate (blueprint §4 poin 7, FASE 33.C). Fails the build on
      # known high/critical advisories in the installed dependency tree. pnpm
      # audit is built in — no new dependency, no external account or API key.
      # --audit-level=high keeps moderate/low advisories from blocking merges.
      # Placed right after install so it runs against the frozen lockfile before
      # the slower suites.
      - run: pnpm audit --audit-level=high

      # Blocking. The import-boundary zones live in eslint.config.mjs, so this is
      # what turns an architecture violation into a failed build rather than a
      # note in a document. Keep it ahead of the slower suites so it fails fast.
      - run: pnpm run lint

      - run: pnpm run typecheck

      # Blocking, and deliberately not optional: a broken `apps/api` bundle
      # (an esbuild alias that could not resolve `@chai/auth/server`) shipped
      # undetected because lint/typecheck/test all pass on source while the
      # production bundle never builds. typecheck uses moduleResolution
      # "Bundler"; only this step exercises the real esbuild/Next build.
      - run: pnpm run build

      - run: pnpm run test

      # Infra configs are not TypeScript, so lint/typecheck/test are blind to
      # them. Nine production bugs hid in postgres.conf / nginx.conf /
      # prometheus.yml / otel-collector.yaml / sentinel.conf because nothing
      # ever executed those files. This runs each one through its real consumer.
      - run: pnpm run verify:infra

      # Docker services are available on GitHub runners, so the suites that
      # need a real PostgreSQL (RLS policies, the migration runner, the
      # tenant-isolation matrix) can and should gate merges too — they are the
      # only tests that prove the invariants at the database level.
      - run: pnpm --filter @chai/database run test:integration
      - run: pnpm --filter @chai/domain run test:integration
      - run: pnpm --filter @chai/api run test:integration
      - run: pnpm --filter @chai/api run test:e2e
