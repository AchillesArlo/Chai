name: ci

# Gate for the blueprint's non-negotiables (02 §5, GAP-009). The import-boundary
# rules live in eslint.config.mjs, so `lint` is what makes a cross-boundary import
# fail the build rather than merely being discouraged in a document.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24.12.0

      - run: pnpm install --frozen-lockfile

      # Blocking. The import-boundary zones live in eslint.config.mjs, so this is
      # what turns an architecture violation into a failed build rather than a
      # note in a document. Keep it ahead of the slower suites so it fails fast.
      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run test
